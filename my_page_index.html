<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人形象網頁</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts 以獲得更美觀的字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 使用 Noto Sans TC 處理中文，Inter 處理英文及數字，確保顯示效果一致且美觀 */
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            /* 新增一個柔和的背景漸層，增加視覺層次感 */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        /* 為連結按鈕添加一個微妙的光暈效果 */
        .link-button:hover {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 antialiased">

    <!-- 主內容區塊 -->
    <main class="max-w-md w-full bg-slate-800/60 backdrop-blur-sm rounded-2xl shadow-2xl p-8 space-y-6 ring-1 ring-white/10 transition-transform duration-300 hover:scale-[1.01]">

        <!-- 頁首：頭像、姓名、職稱 -->
        <header class="text-center space-y-4">
            <!-- 將頭像圖片 URL 替換成您自己的 -->
            <img src="喝咖啡.jpeg" alt="個人頭像" class="w-32 h-32 rounded-full mx-auto ring-4 ring-slate-700 shadow-lg">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-wider">睫毛</h1>
                <p class="text-slate-400 text-md">軟體工程師 | ACGN 部落客 | 遊戲實況主</p>
            </div>
        </header>

        <!-- 關於我 -->
        <section>
            <p class="text-center text-slate-300">
                熱衷於打造優雅且高效的程式碼，閒暇時沉浸在 ACGN 的世界並轉化為文字。同時，也在 YouTube 上分享遊戲的點滴與歡樂。
            </p>
        </section>

        <!-- 外部連結區 -->
        <section class="space-y-4 pt-2">
            <!-- GitHub 連結 -->
            <a href="https://github.com/eyelash500" target="_blank" class="link-button group flex items-center justify-center w-full bg-slate-700/50 hover:bg-slate-700/80 transition-all duration-300 text-white font-semibold py-3 px-4 rounded-lg">

            <!-- iThome Blog 連結 -->

                <svg class="w-5 h-5 mr-3 text-slate-400 group-hover:text-cyan-400 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">

            <!-- LinkedIn 連結 -->
            <a href="https://linkedin.com/in/tony-wu-5baa4b81/" target="_blank" class="link-button group flex items-center justify-center w-full bg-slate-700/50 hover:bg-slate-700/80 transition-all duration-300 text-white font-semibold py-3 px-4 rounded-lg">
                <svg class="w-5 h-5 mr-3 text-slate-400 group-hover:text-sky-400 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">

        <!-- 頁尾 -->
        <footer class="text-center text-xs text-slate-500 pt-4">

    </main>
